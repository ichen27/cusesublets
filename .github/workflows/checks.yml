name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: python3 tests/tour-processor-unit.py
      - name: Room mesh checks
        run: |
          python3 -m venv /tmp/room-mesh
          /tmp/room-mesh/bin/pip install --quiet numpy==2.1.3
          /tmp/room-mesh/bin/python tests/room-mesh-unit.py
      - name: Spot panorama stitching checks
        run: |
          python3 -m venv /tmp/spots
          /tmp/spots/bin/pip install --quiet -r processing/requirements-spots.txt
          /tmp/spots/bin/python tests/spot-stitch-unit.py
          /tmp/spots/bin/python tests/studio-unit.py
      - run: python3 tests/housing-search-migration.py
      - run: python3 tests/search-write-races.py
      - run: python3 tests/social-write-races.py
      - run: python3 tests/private-drafts-races.py
      - run: npm run build
      - run: npm run build:studio
      - run: npx tsc --noEmit -p prototype/tsconfig.json
      - run: npx vite build --config prototype/vite.config.ts
