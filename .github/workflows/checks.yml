name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm run test:reviewer
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: python3 tests/tour-processor-unit.py
      - run: python3 tests/housing-search-migration.py
      - run: python3 tests/search-write-races.py
      - run: python3 tests/social-write-races.py
      - run: python3 tests/private-drafts-races.py
      - run: npm run build
      - run: npx tsc --noEmit -p prototype/tsconfig.json
      - run: npx vite build --config prototype/vite.config.ts
