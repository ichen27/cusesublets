name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: python3 tests/housing-search-migration.py
      - run: python3 tests/search-write-races.py
      - run: npm run build
      - run: npx tsc --noEmit -p prototype/tsconfig.json
      - run: npx vite build --config prototype/vite.config.ts
