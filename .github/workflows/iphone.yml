name: iPhone
on:
  push:
    branches: [main]
    paths: ['package.json', 'package-lock.json', 'wrangler.jsonc', 'seeds/**', 'src/**', 'public/**', 'processing/**', 'index.html', 'vite.config.ts', 'tsconfig.json', 'ios/**', 'worker/**', 'shared/**', 'migrations/**', 'tests/iphone-runtime.py', 'tests/tours-runtime.py', 'tests/account-deletion-runtime.py', 'tests/member-blocks-runtime.py', '.github/workflows/iphone.yml']
  pull_request:
    paths: ['package.json', 'package-lock.json', 'wrangler.jsonc', 'seeds/**', 'src/**', 'public/**', 'processing/**', 'index.html', 'vite.config.ts', 'tsconfig.json', 'ios/**', 'worker/**', 'shared/**', 'migrations/**', 'tests/iphone-runtime.py', 'tests/tours-runtime.py', 'tests/account-deletion-runtime.py', 'tests/member-blocks-runtime.py', '.github/workflows/iphone.yml']
permissions:
  contents: read
concurrency:
  group: iphone-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  iphone:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Prepare isolated API
        run: |
          npx wrangler d1 migrations apply DB --local --persist-to work/iphone-state
          npx wrangler d1 execute DB --local --persist-to work/iphone-state --file seeds/demo.sql
          npx wrangler dev --ip 127.0.0.1 --port 8936 --persist-to work/iphone-state --var APP_ENV:development --var TOUR_PROCESSOR_TOKEN:isolated-synthetic-tour-test-token-64-characters-only > work/iphone-api.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8936/api/session; then exit 0; fi
            sleep 1
          done
          cat work/iphone-api.log
          exit 1
      - run: API_BASE=http://127.0.0.1:8936 python3 tests/iphone-runtime.py
      - run: API_BASE=http://127.0.0.1:8936 TOUR_PROCESSOR_TOKEN=isolated-synthetic-tour-test-token-64-characters-only python3 tests/tours-runtime.py
      - run: API_BASE=http://127.0.0.1:8936 python3 tests/account-deletion-runtime.py
      - run: API_BASE=http://127.0.0.1:8936 python3 tests/member-blocks-runtime.py
      - name: Test on installed iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for devices in d["devices"].values() for v in devices if v["name"].startswith("iPhone")))')
          xcodebuild -project ios/CuseSublets.xcodeproj -scheme CuseSublets -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath work/ios-build -resultBundlePath work/iphone-tests.xcresult CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: iphone-validation
          path: |
            work/iphone-tests.xcresult
            work/iphone-api.log
